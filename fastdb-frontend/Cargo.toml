# FastDB frontend crate (Phase 0). FastDB-authored.
# MIT licensed; publish stays disabled until explicit alpha packaging.
[package]
name = "turso_fastdb"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
turso_fastdb_parser = { path = "../fastdb-parser" }
turso_core = { workspace = true, features = ["conn_raw_api"] }
turso_parser = { workspace = true }
miette = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
uuid = { version = "1.11.0", features = ["v4", "v7"] }
base64 = "=0.22.1"
chrono = { workspace = true, features = ["std"] }
regex = "=1.12.2"
rust_decimal = { version = "=1.42.0", default-features = false, features = ["std"] }
ciborium = "=0.2.2"
blake3 = "=1.7.0"
hex = "=0.4.3"
md-5 = "=0.11.0"
sha1 = "=0.10.6"
sha2 = "=0.10.9"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
turso_core = { workspace = true, features = ["fts"] }

[features]
# Exposes deterministic failure-injection (`arm_failpoint`/`disarm_all_failpoints`).
# Test/benchmark-only; never enabled in release builds.
testing = []
