name: FastDB
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: fastdb-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88 --profile minimal --component rustfmt --component clippy
      - name: FastDB checks
        run: fastdb/scripts/check.sh
