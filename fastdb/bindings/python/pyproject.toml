[build-system]
requires = ["maturin==1.12.6"]
build-backend = "maturin"

[project]
name = "fastdb-embedded"
version = "2.0.0"
description = "Embedded FastDB and FastQL for Python"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.md", "THIRD_PARTY_NOTICES.md", "THIRD_PARTY_CRATE_NOTICES.md", "RUST-LIBRARY-NOTICES.html"]
readme = "README.md"

[tool.maturin]
python-source = "python"
module-name = "fastdb._native"
