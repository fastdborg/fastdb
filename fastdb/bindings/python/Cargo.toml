[package]
name = "fastdb-python"
version = "2.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
fastdb = { path = "../../frontend" }
pyo3 = { version = "=0.29.0", features = ["abi3-py310", "extension-module"] }
fastdb-protocol = { path = "../protocol" }
serde_json.workspace = true
