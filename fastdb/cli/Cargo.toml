[package]
name = "fastdb-cli"
version = "2.0.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
fastdb = { path = "../frontend" }
fastql-parser = { path = "../parser" }
serde_json.workspace = true
reqwest = { version = "=0.13.2", default-features = false, features = ["blocking", "rustls"] }
uuid = { version = "=1.17.0", features = ["v4"] }
rustyline = { version = "=15.0.0", default-features = false, features = ["with-file-history"] }

[target.'cfg(unix)'.dependencies]
signal-hook = "=0.3.18"
