# FastDB integration tests (Phase 0). Test-only package.
[package]
name = "turso_fastdb_tests"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
turso_fastdb = { path = "../fastdb-frontend", features = ["testing"] }
turso_fastdb_parser = { path = "../fastdb-parser" }
turso_core = { workspace = true }
tempfile = { workspace = true }
uuid = { version = "1.11.0", features = ["v4", "v7"] }
