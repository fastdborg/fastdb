# FastDB Phase 0 benchmarks. FastDB-authored.
[package]
name = "turso_fastdb_benchmarks"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
fastdb = { path = "../fastdb-api" }
turso_fastdb = { path = "../fastdb-frontend", features = ["testing"] }
turso_core = { workspace = true }
tempfile = { workspace = true }
criterion = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
uuid = { version = "1.11.0", features = ["v7"] }

[[bench]]
name = "phase0"
harness = false

[[bin]]
name = "phase5-release-bench"
path = "src/bin/phase5_release.rs"

[[bin]]
name = "phase7-graph-bench"
path = "src/bin/phase7_graph.rs"

[[bin]]
name = "phase8-fts-bench"
path = "src/bin/phase8_fts.rs"
